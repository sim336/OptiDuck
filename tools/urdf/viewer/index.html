<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>疯狂小鸡 · URDF/MJCF 3D 检查器</title>
<style>
  :root {
    --bg: #131519;
    --bg2: #1b1e24;
    --bg3: #232830;
    --line: #2e343d;
    --txt: #dfe5ec;
    --dim: #8b94a1;
    --acc: #4da3ff;
    --acc2: #ff7a59;
    --ok: #57c98f;
    --warn: #e6b64c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--txt); display: flex; flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 8px 14px;
    background: var(--bg2); border-bottom: 1px solid var(--line); flex: 0 0 auto;
    flex-wrap: wrap;
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; }
  header .sub { color: var(--dim); font-size: 12px; }
  .spacer { flex: 1; }
  .btn {
    background: var(--bg3); color: var(--txt); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer;
    user-select: none;
  }
  .btn:hover { border-color: var(--acc); }
  .btn.primary { background: #1d2b3d; border-color: #2b4a6b; color: var(--acc); }
  label.tgl { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); user-select: none; cursor: pointer; }
  label.tgl input { accent-color: var(--acc); }
  #main { display: flex; flex: 1; min-height: 0; }
  #viewport { position: relative; flex: 1; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: absolute; top: 10px; left: 10px; pointer-events: none;
    background: rgba(16,18,22,.72); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 12px; font-size: 12px; line-height: 1.6; backdrop-filter: blur(3px);
    max-width: 340px;
  }
  #hud b { color: var(--acc); }
  #hud .warn { color: var(--warn); }
  #status {
    position: absolute; bottom: 10px; left: 10px; pointer-events: none; color: var(--dim);
    font-size: 11px; background: rgba(16,18,22,.6); border-radius: 6px; padding: 4px 10px;
  }
  aside {
    flex: 0 0 360px; background: var(--bg2); border-left: 1px solid var(--line);
    overflow-y: auto; padding: 10px 12px 20px;
  }
  details { margin-bottom: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg3); overflow: hidden; }
  details > summary {
    cursor: pointer; list-style: none; padding: 8px 10px; font-size: 12px; font-weight: 600;
    color: var(--dim); display: flex; justify-content: space-between; align-items: center;
    user-select: none;
  }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::after { content: "▾"; color: var(--dim); font-size: 10px; transition: transform .15s; }
  details[open] > summary::after { transform: rotate(180deg); }
  details .jt { padding: 7px 10px; border-top: 1px solid var(--line); }
  .jt-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .jt-name { font-family: "Cascadia Mono", Consolas, monospace; font-size: 12px; color: var(--txt); cursor: pointer; }
  .jt-name:hover { color: var(--acc); }
  .jt-val { font-family: Consolas, monospace; font-size: 12px; color: var(--acc2); font-weight: 600; cursor: pointer; }
  .jt-limits { display: flex; justify-content: space-between; color: var(--dim); font-size: 10.5px; font-family: Consolas, monospace; }
  input[type=range] { width: 100%; margin: 2px 0; accent-color: var(--acc); height: 18px; cursor: pointer; }
  .axis-row { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 11px; font-family: Consolas, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .diag { font-size: 11.5px; line-height: 1.7; padding: 8px 10px; }
  .diag .ok { color: var(--ok); }
  .diag .warn { color: var(--warn); }
  .diag .bad { color: var(--acc2); }
  .diag table { width: 100%; border-collapse: collapse; font-size: 11px; font-family: Consolas, monospace; }
  .diag td, .diag th { padding: 3px 6px; border-bottom: 1px solid var(--line); text-align: left; }
  .diag th { color: var(--dim); font-weight: 600; }
  .diag .mono { font-family: Consolas, monospace; }
  #err {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: var(--bg); z-index: 50; color: var(--acc2); font-size: 14px; text-align: center; padding: 30px;
  }
  .picker { display: flex; gap: 6px; flex-wrap: wrap; }
  .sw { width: 22px; height: 22px; border-radius: 5px; border: 2px solid var(--line); cursor: pointer; }
  .sw.sel { border-color: var(--acc); }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
</head>
<body>
  <div id="err"></div>
  <header>
    <h1>🐤 疯狂小鸡 · URDF/MJCF 3D 检查器</h1>
    <span class="sub" id="hdrInfo">加载中…</span>
    <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);user-select:none">
      模型
      <select id="modelSel" style="background:var(--bg3);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;max-width:280px"></select>
    </label>
    <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--acc2);user-select:none">
      叠加参考
      <select id="refSel" style="background:var(--bg3);color:var(--acc2);border:1px solid var(--acc2);border-radius:6px;padding:4px 8px;font-size:12px;max-width:200px"></select>
      <input type="checkbox" id="refOn" title="显示/隐藏半透明参考模型" />
    </label>
    <div class="spacer"></div>
    <label class="tgl"><input type="checkbox" id="showAxes" checked /> 显示关节轴/坐标系</label>
    <button class="btn" id="btnUp">世界轴: Z↑</button>
    <label class="tgl"><input type="checkbox" id="showGrid" checked /> 参考网格</label>
    <label class="tgl"><input type="checkbox" id="wireframe" /> 线框</label>
    <label class="tgl"><input type="checkbox" id="transparent" /> 半透明</label>
    <label class="tgl"><input type="checkbox" id="bbox" /> 包围盒</label>
    <label class="tgl"><input type="checkbox" id="homePose" checked /> HOME 位形(全 0°)</label>
    <button class="btn" id="btnFit">适应视角</button>
    <button class="btn primary" id="btnHome">HOME 复位</button>
  </header>
  <div id="main">
    <div id="viewport">
      <canvas id="gl"></canvas>
      <div id="hud"></div>
      <div id="status">URDF/MJCF 装配检查 · 拖动旋转视角 · 滚轮缩放 · 点击关节名高亮部件</div>
    </div>
    <aside id="panel"></aside>
  </div>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
